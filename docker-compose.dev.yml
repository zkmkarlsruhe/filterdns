# Development docker-compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

version: '3.8'

services:
  filterdns:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./filterdns:/app/filterdns:ro
      - ./blocklists.yaml:/app/blocklists.yaml:ro
      - blocklist-cache:/app/data/blocklists
    environment:
      - FILTERDNS_DEBUG=true
    ports:
      - "5353:53/udp"    # Use non-privileged port for development
      - "5353:53/tcp"

  db:
    ports:
      - "5432:5432"      # Expose PostgreSQL for development
