[tool.poetry]
name = "filterdns"
version = "0.1.0"
description = "Self-hosted DNS filtering service with per-profile configuration"
authors = ["Marc Schütze"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/zkmkarlsruhe/filterdns"
keywords = ["dns", "filtering", "adblock", "privacy", "self-hosted"]
packages = [{include = "filterdns"}]

[tool.poetry.dependencies]
python = "^3.11"
dnspython = "^2.6"
hypercorn = "^0.17"
quart = "^0.19"
quart-cors = "^0.7"
asyncpg = "^0.29"
pydantic = "^2.6"
pydantic-settings = "^2.2"
httpx = "^0.27"
bcrypt = "^4.1"
structlog = "^24.1"
alembic = "^1.13"
PyYAML = "^6.0"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
black = "^24.1"
ruff = "^0.2"
mypy = "^1.8"

[tool.poetry.scripts]
filterdns = "filterdns.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
