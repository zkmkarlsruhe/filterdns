version: '3.8'

services:
  filterdns:
    build: .
    ports:
      - "53:53/udp"      # Legacy DNS (UDP)
      - "53:53/tcp"      # Legacy DNS (TCP)
      - "443:443"        # DoH (HTTPS)
      - "853:853"        # DoT (TLS)
      - "8080:8080"      # Admin UI + API
    volumes:
      - blocklist-cache:/app/data/blocklists
      - ./certs:/app/certs:ro    # TLS certificates (optional)
    environment:
      - DATABASE_URL=postgresql://filterdns:${DB_PASSWORD:-filterdns}@db:5432/filterdns
      - FILTERDNS_DOMAIN=${FILTERDNS_DOMAIN:-filterdns.example.com}
      - FILTERDNS_ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - FILTERDNS_UPSTREAM_DNS=1.1.1.1,8.8.8.8
      - FILTERDNS_TLS_CERT=/app/certs/cert.pem
      - FILTERDNS_TLS_KEY=/app/certs/key.pem
      - FILTERDNS_DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - filterdns

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=filterdns
      - POSTGRES_PASSWORD=${DB_PASSWORD:-filterdns}
      - POSTGRES_DB=filterdns
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filterdns"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - filterdns

  # Optional: Run migrations on startup
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://filterdns:${DB_PASSWORD:-filterdns}@db:5432/filterdns
    depends_on:
      db:
        condition: service_healthy
    networks:
      - filterdns
    restart: "no"

volumes:
  pgdata:
  blocklist-cache:

networks:
  filterdns:
    driver: bridge
